apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'expo-module'

android {
    namespace "expo.modules.shazamandroid"
    compileSdk 34

    defaultConfig {
        minSdk 23
        targetSdk 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.majorVersion
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    // ShazamKit Android SDK de Apple
    implementation "com.apple.shazamkit:shazamkit-android:1.0"
    // Coroutines para manejar el Flow del SDK
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    // Core KTX para ContextCompat
    implementation "androidx.core:core-ktx:1.13.1"
}
